[package]
name = "frustumR"
version = "0.1.0"
edition = "2021"
description = "R bindings for Frustum GPU rendering framework"
license = "MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
frustum-core = { git = "https://github.com/gcol33/frustum.git", tag = "v0.1.0" }
frustum-render = { git = "https://github.com/gcol33/frustum.git", tag = "v0.1.0" }
extendr-api = "0.7"
