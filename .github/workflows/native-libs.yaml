on:
  workflow_dispatch:

name: native-libs

permissions: read-all

jobs:
  native-libs:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  target: ''}
          - {os: macos-latest,   target: ''}
          - {os: windows-latest, target: 'x86_64-pc-windows-gnu'}

    steps:
      - uses: actions/checkout@v4

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Print native static libs
        shell: bash
        run: |
          rustc --version
          cargo --version
          if [ -n "${{ matrix.target }}" ]; then TARGET_ARG="--target ${{ matrix.target }}"; fi
          cargo rustc --lib --release --locked $TARGET_ARG \
            --manifest-path src/rust/Cargo.toml -- --print native-static-libs 2>&1 \
            | tee build.log
          grep "native-static-libs" build.log
